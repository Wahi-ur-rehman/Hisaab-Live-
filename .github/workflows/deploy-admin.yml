name: Deploy Super Admin to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'super-admin/**'
      - 'firestore.rules'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Super Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: super-admin/package-lock.json

      - name: Install Dependencies
        working-directory: super-admin
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Super Admin
        working-directory: super-admin
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCcbUDXSqjFOwXHC1_3j3PfuxG6i2msT3E' }}
          VITE_FIREBASE_AUTH_DOMAIN: hissab-live.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: hissab-live
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HISSAB_LIVE }}'
          channelId: live
          projectId: hissab-live
        continue-on-error: true
