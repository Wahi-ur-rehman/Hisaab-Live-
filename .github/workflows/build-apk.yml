name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Install dependencies & Build Web App
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCcbUDXSqjFOwXHC1_3j3PfuxG6i2msT3E' }}
          VITE_FIREBASE_AUTH_DOMAIN: hissab-live.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: hissab-live
          VITE_FIREBASE_STORAGE_BUCKET: hissab-live.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 1028486183617
          VITE_FIREBASE_APP_ID: 1:1028486183617:web:e03c33a79f79c06645f240
          VITE_FIREBASE_MEASUREMENT_ID: G-206RRHW2HG
        run: |
          cd owner-app
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd owner-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisaablive-owner-app-apk
          path: owner-app/android/app/build/outputs/apk/debug/app-debug.apk
